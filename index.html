  <title>Stempeluhr</title>
  <script>
    // Farbschema sofort setzen, damit der Startbildschirm nicht aufblitzt
    try {
      var t = matchMedia('(prefers-color-scheme: dark)').matches ? 'glas-dunkel' : 'glas-hell';   // immer Glas
      var hr = new Date().getHours();
      document.documentElement.dataset.tod = hr >= 5 && hr < 11 ? 'morgen' : hr < 17 && hr >= 11 ? 'tag' : hr >= 17 && hr < 21 ? 'abend' : 'nacht';
      document.documentElement.dataset.theme = t;
      var pr = JSON.parse(localStorage.getItem('stempeluhr.prefs') || '{}');
      if (pr.bg !== 'klassisch') document.documentElement.dataset.bg = 'weich';
      document.documentElement.dataset.bgc = pr.bgc || 'graphit';
    } catch (e) {}
  </script>
  <style>
    #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #f4f5f7; transition: opacity .4s ease; }
    [data-theme="creme"] #splash { background: #f3ede1; }
    [data-theme="dunkel"] #splash { background: #111317; }
    [data-theme="dunkelblau"] #splash { background: #0b1626; }
    [data-theme="glas-hell"] #splash { background: #e9eef6; }
    [data-theme="glas-dunkel"] #splash { background: #05070d; }
    #splash img { width: 46vw; max-width: 260px; filter: brightness(0); animation: sp-in .5s ease-out both; }
    [data-theme="dunkel"] #splash img, [data-theme="dunkelblau"] #splash img, [data-theme="glas-dunkel"] #splash img { filter: brightness(0) invert(1); }
    #splash.gone { opacity: 0; pointer-events: none; }
    @keyframes sp-in { from { opacity: 0; transform: scale(.96); } }
  </style>
