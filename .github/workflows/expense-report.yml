name: Spesenblatt

on:
  schedule:
    - cron: '12 18 * * *'   # täglich 18:12 UTC (19:12/20:12 Zürich) – Skript prüft selbst, ob Monatsende ist
  workflow_dispatch:
    inputs:
      month:
        description: 'Monat jetzt erzeugen (YYYY-MM), leer = automatisch'
        type: string
        default: ''

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/expense-report.mjs
        env:
          TZ: Europe/Zurich
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MONTH: ${{ inputs.month }}
