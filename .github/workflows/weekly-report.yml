name: Wochen-PDF

on:
  schedule:
    # GitHub verschiebt/überspringt geplante Läufe manchmal – darum drei Versuche am Montag.
    # Bereits erstellte Wochen werden übersprungen, es entstehen keine Doppel.
    - cron: '12 1 * * 1'   # 02:12/03:12 Zürich
    - cron: '37 4 * * 1'   # 05:37/06:37 Zürich
    - cron: '23 9 * * 1'   # 10:23/11:23 Zürich
  workflow_dispatch:
    inputs:
      force:
        description: 'Letzte Woche neu erzeugen'
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/weekly-report.mjs
        env:
          TZ: Europe/Zurich
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
