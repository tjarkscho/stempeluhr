name: Keep-alive

on:
  schedule:
    - cron: '23 5 */2 * *'   # alle 2 Tage
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Supabase anpingen
        run: node scripts/keepalive.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # GitHub deaktiviert geplante Workflows nach 60 Tagen ohne Repo-Aktivität.
      # Re-Aktivieren per API verhindert das.
      - name: Geplante Workflows aktiv halten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/weekly-report.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/expense-report.yml/enable"
